apiVersion: apps/v1
kind: Deployment
metadata:
  name: cianaaiapi-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cianaaiapi
  template:
    metadata:
      labels:
        app: cianaaiapi
    spec:
      containers:
      - name: cianaaiapi
        image: cianadevregistry.azurecr.io/cianaaiapi:v2
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: cianaaiapi-config
---
apiVersion: v1
kind: Service
metadata:
  name: cianaaiapi-service
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: cianaaiapi
