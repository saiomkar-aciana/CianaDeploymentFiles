apiVersion: apps/v1
kind: Deployment
metadata:
  name: cianacareui-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cianacareui
  template:
    metadata:
      labels:
        app: cianacareui
    spec:
      containers:
      - name: cianacareui
        image: cianadevregistry.azurecr.io/cianacareui:v5
        ports:
        - containerPort: 4200
---
apiVersion: v1
kind: Service
metadata:
  name: cianacareui-service
spec:
  type: ClusterIP
  ports:
  - port: 4200
    targetPort: 4200
    protocol: TCP
  selector:
    app: cianacareui
